<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
      body {
        font-family: Arial;
      }

      .heading-text {
        font-size: 20px;
      }

      .input-box {
        width: 250px;
        height: 40px;
        margin-top: 10px;
        padding-left: 20px;
        border: 1px solid rgb(128, 127, 127);
        border-radius: 10px;
        background-color: white;
        color: rgb(128, 127, 127);
        font-size: 15px;
        font-family: Arial;
      }

      .action-button {
        margin-top: 24px;
        margin-right: 10px;
        padding: 10px 16px;
        border: none;
        border-radius: 10px;
        color: white;
        font-size: 15px;
        background-color: rgb(0, 123, 255);
      }

    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="external-code/react.js"></script>
    <script src="external-code/react-dom.js"></script>

    <script src="external-code/babel.js"></script>
    <script type="text/babel">

      // Fixed: Removed incorrect destructuring from function parameters
      // LoginForm no longer expects arguments, uses React.useState for password visibility
      function LoginForm () {
        const [showPassword, setShowPassword] = React.useState(false);

        // Fixed: Toggle password visibility when button is clicked
        function security () {
          setShowPassword(!showPassword);
        }


        return (
          <>
              <div>
                <input type="Email" className="input-box" placeholder="Email" />
              </div>
              <div>
                {/* Fixed: Changed type to text when showPassword is true, removed invalid props */}
                <input 
                  type={showPassword ? "text" : "password"} 
                  className="input-box" 
                  placeholder="password" 
                />
                <button
                  onClick={security}
                >{showPassword ? "hide" : "show"}</button>
              </div>
              <button className="action-button">Login</button>
              <button className="action-button">Sign up</button>
          </>
        );
      }
        
        function App() {
          return (
            <>
              <p className="heading-text">Hello, Welcome to my website</p>
              <LoginForm />
            </>
          );
        }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
