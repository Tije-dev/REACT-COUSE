<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="external-code/react.js"></script>
    <script src="external-code/react-dom.js"></script>

    <script src="external-code/babel.js"></script>
    <script type="text/babel">


      const div = (
        <div>
          <p>my name is Tijjani Abubakar</p>
        </div>
      );
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(div);
    </script>
  </body>
</html>
