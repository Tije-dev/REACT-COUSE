<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot exercise</title>
  </head>
  <body>
    <div class="js-container"></div>

      <script src="external-code/DayJs.js"></script>
      <script src="external-code/react.js"></script>
      <script src="external-code/react-dom.js"></script>
      <script src="../external-code/chatbot-data.js"></script>
      <script src="external-code/babel.js"></script>

    <script type="text/babel">
    
    function ChatInput ({chatMessages, setChatMessages}) {
      const [inputText, setInputText] = React.useState('');

      function saveInputText (event) {
        setInputText(event.target.value);
      }

      function sendMessage () {
        const newChatmessage = [
        ...chatMessages,
        {
          message: inputText,
          sender: 'user',
          id: crypto.randomUUID()
        }
        ]

        setChatMessages(newChatmessage);

        const response = Chatbot.getResponseAsync(inputText).await;
        setChatMessages([
        ...newChatmessage,
        {
          message: response,
          sender: 'robot',
          id: crypto.randomUUID()
        }
        ])

        setInputText('');
      }

      function enter (event){
        if(event.key === 'Enter') {
          sendMessage();
        }

        if(event.key === 'Escape') {
          setInputText('');
        }
      }

      return (  
        <>
          <input 
            placeholder="Send a message to Chatbot" 
            size="30" 
            onChange={saveInputText}
            value={inputText}
            onKeyDown={enter}

          />   
          <button
          onClick={sendMessage}
          >Send</button>       
        </>
      );
    }

    function ChatMessage ({message, sender}) {
      // const message = props.message;
      // const sender = props.sender;
      // const {message, sender} = props;      
      /*       
      if (sender === 'robot') {
        return (
          <div>
            <img src="robot.png" width="50" />
            {message}
          </div>
        );
      } */ 
     
      return (
        <div>
          {sender === 'robot' && ( 
            <img src="robot.png" width="50" />
          )}
          {message}
          {sender === 'user' &&  (
            <img src="user.png" width="50" />
          )} 
        </div>
      );
    }

    function ChatMessages ({chatMessages}){
      return (
          <>
              {chatMessages.map((chatMessage) => {
                return ( 
                  <ChatMessage 
                    message={chatMessage.message}
                    sender={chatMessage.sender}
                    key={chatMessage.id}
                  />
                );
              })}

          </>
      );
    }

    function App() {

            const [chatMessages, setChatMessages] = React.useState([{
        message: 'hello chatbot',
        sender: 'user',
        id: 'id1'
      }, {
        message: 'Hello! How can I help you?',
        sender: 'robot',
        id: 'id2'
      }, {
        message: 'can you get me today day',
        sender: 'user',
        id: 'id3'
      }, {
        message: 'Today is January 15',
        sender: 'robot',
        id: 'id4'
      }]);

      // const [chatMessages, setChatMessages] = array;
      //const chatMessages = array[0];
      //const setChatMessages = array[1];

      return (
        <>
          <ChatInput 
          chatMessages={chatMessages}
          setChatMessages={setChatMessages}
          
          />
          <ChatMessages 
          chatMessages={chatMessages}
          />
        </>
      );
    }


      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
