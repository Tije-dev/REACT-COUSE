<!DOCTYPE html>
<html>
    <head>
        <title>React Basics</title>
    </head>
    <body>
        <div class="js-container"></div>
        
        <script src="external-code/DayJs.js"></script>
        <script src="external-code/react.js"></script>
        <script src="external-code/react-dom.js"></script>
        <script src="external-code/babel.js"></script>
        <script type="text/babel">

        const paragraph = <p>Current time: {dayjs().format('HH:mm:ss')}</p>;

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(paragraph);

      setInterval(() => {
        const paragraph = <p>Current time: {dayjs().format('HH:mm:ss')}</p>;
        root.render(paragraph);
      }, 1000);

        </script>
    </body>
</html>
