<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="external-code/react.js"></script>
    <script src="external-code/react-dom.js"></script>

    <script src="external-code/babel.js"></script>
    <script type="text/babel">

        const productCost = 10 + 8 + 8;
        const shippingCost = 5; 

        const div = (
            <div>
              <p>Product cost: ${productCost}</p>
              <p>Shipping cost: ${shippingCost}</p>
              <p>Total cost: ${productCost + shippingCost}</p>
              <button>Place your oder</button>
            </div>
        );

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(div);
    </script>
  </body>
</html>
