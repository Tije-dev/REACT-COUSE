<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
      <style>
          body{
            font-family: Arial;
            margin-top: 0;
            margin-bottom: 0;
          }
      .send-button {
        background-color: rgb(25, 135, 83);
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }

      .chat-input {
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;

        flex-grow: 1;
      }

      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }

       .app-container {
          max-width: 600px;
          margin-left: auto;
          margin-right: auto;

          height: 100vh;
          display: flex;
          flex-direction: column;
       }

       .welcome-message {
         text-align: center;
         font-size: 20px;
         margin-bottom: 20px;
         margin-top: 20px;
         color: #333;
       }

       .chat-message-user{
          display: flex;
          justify-content: end;
          align-items: start;
       }
       .chat-message-robot{
          display: flex;
          align-items: start;
       }

       .chat-message-text {
          background-color: rgb(238, 238, 238);
          padding: 15px 20px;
          border-radius: 10px;
          margin-right: 10px;
          margin-left: 10px;
          margin-bottom: 20px;
          max-width: 300px;
       }

       .chat-message-profile{
        width: 45px;
       }

       .chat-message-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
       }

       .loading-spinner {
         display: flex;
         align-items: start;
         margin-bottom: 20px;
         margin-left: 10px;
       }

       .loading-spinner img {
         width: 45px;
         height: 45px;
         margin-right: 10px;
       }

       img.loading-spinner-gif {
         width: 50px;
         height: 50px;
         background-color:  rgb(238, 238, 238);
          border-radius: 10px;
       }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="external-code/react.js"></script>
    <script src="external-code/react-dom.js"></script>

    <script src="external-code/chatbot-data.js"></script>
    <script src="external-code/chatbot.js"></script>
    <script src="external-code/babel.js"></script>
    <script type="text/babel">
    
    function ChatInput ({chatMessages, setChatMessages, setIsLoading}) {
      const [inputText, setInputText] = React.useState('');

      function saveInputText (event) {
        setInputText(event.target.value);
      }

      function sendMessage () {
        const newChatmessage = [
          ...chatMessages,
          {
            message: inputText,
            sender: 'user',
            id: crypto.randomUUID()
          }
        ];
        setChatMessages(newChatmessage);
        setIsLoading(true);

        setTimeout(() => {
          const response = Chatbot.getResponse(inputText);
          setChatMessages([
            ...newChatmessage,
            {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);
          setIsLoading(false);
        }, 2000); // Adjust this delay (in milliseconds) as needed for realism

        setInputText('');
      }

      return (  
        <div className="chat-input-container">
          <input 
            placeholder="Send a message to Chatbot" 
            size="30" 
            onChange={saveInputText}
            value={inputText}
            className="chat-input"
          />   
          <button
            onClick={sendMessage}         
            className="send-button"
          >Send</button>       
        </div>
      );
    }

    function ChatMessage ({message, sender}) {
      // const message = props.message;
      // const sender = props.sender;
      // const {message, sender} = props;      
      /*       
      if (sender === 'robot') {
        return (
          <div>
            <img src="robot.png" width="50" />
            {message}
          </div>
        );
      } */ 
     
      return (
        <div className={
          sender === 'user' 
            ? 'chat-message-user' 
            : 'chat-message-robot'
        }>
          {sender === 'robot' && ( 
            <img src="robot.png" className="chat-message-profile" />
          )}
          <div className="chat-message-text">
            {message}
          </div>
          {sender === 'user' &&  (
            <img src="user.png" className="chat-message-profile" />
          )} 
        </div>
      );
    }

    function ChatMessages ({chatMessages, isLoading}){
      const chatMessageRef = React.useRef(null);

      React.useEffect(() => {
        const containerElem = chatMessageRef.current;
        if(containerElem){
          containerElem.scrollTop = containerElem.scrollHeight;
        }
      }, [chatMessages]);

      return (
        <div className="chat-message-container" ref={chatMessageRef}>
          {chatMessages.map((chatMessage) => {
            return ( 
              <ChatMessage 
                message={chatMessage.message}
                sender={chatMessage.sender}
                key={chatMessage.id}
              />
            );
          })}
          {isLoading && (
            <div className="loading-spinner">
              <img src="robot.png" className="chat-message-profile" />
              <img className="loading-spinner-gif" src="loading-spinner.gif" alt="Loading..." />
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [chatMessages, setChatMessages] = React.useState([]);
      const [isLoading, setIsLoading] = React.useState(false);

      return (
        <div className="app-container">
          {chatMessages.length === 0 && <div className="welcome-message">Welcome to the chatbot project! Send a message using the text box</div>}
          <ChatMessages 
            chatMessages={chatMessages}
            isLoading={isLoading}
          />
          <ChatInput 
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
            setIsLoading={setIsLoading}
          />
        </div>
      );
    }


      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
